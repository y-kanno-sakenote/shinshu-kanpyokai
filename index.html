<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全国新酒鑑評会 入賞酒の記録</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root {
  color-scheme: light dark;
  --paper: #F3F1EB; --paper2: #E9E6DE; --ink: #22201C; --ink2: #5C574F; --line: #CFC9BC; --sel: #1E5A8C;
  --tile: #DAD6CC; --mark: #D6E1EA;
  /* 段階色（0 は --tile）。金賞=金茶、入賞=藍 */
  --g1: #EBD9AE; --g2: #D9B66A; --g3: #B98A2E; --g4: #7E5A16;
  --a1: #C9D7E3; --a2: #93B1CB; --a3: #5684AD; --a4: #1E4F7A;
  --on4: #FFFFFF;
  --gold: #A9771C; --award: #1E5A8C; --entry: #8A847A;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1D1B18; --paper2: #26231F; --ink: #EDE8DD; --ink2: #A8A196; --line: #3E3A33; --sel: #6FB1E8;
    --tile: #3A3731; --mark: #2F4255;
    --g1: #4A3E26; --g2: #7A6230; --g3: #B38A3A; --g4: #E2B878;
    --a1: #2B3A47; --a2: #3D5A75; --a3: #5A87AF; --a4: #8DB9E0;
    --on4: #1D1B18;
    --gold: #E2B878; --award: #6FB1E8; --entry: #A8A196;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Zen Kaku Gothic New", -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  font-size: 15px; line-height: 1.7;
}
a { color: var(--sel); }
button { font: inherit; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; }
header { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); padding: 10px 16px 8px; }
h1 { font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 700; font-size: 1.35rem; letter-spacing: .03em; margin: 0; line-height: 1.35; }
.meta { font-size: .78rem; color: var(--ink2); margin: 1px 0 8px; }
.ctrl { display: flex; gap: 8px; align-items: center; max-width: 620px; }
.search { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper2); color: var(--ink); }
.tabs { display: flex; gap: 4px; flex: none; }
.tab, .chip { font-size: .88rem; font-weight: 700; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; }
.tab[aria-selected="true"], .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
main { padding: 12px 16px 32px; }
[hidden] { display: none !important; }
h2.sec { font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.1rem; margin: 6px 0 4px; }
.note { font-size: .8rem; color: var(--ink2); margin: 2px 0; }

/* 地図 */
.mapctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 6px; max-width: 860px; }
.yr { display: flex; align-items: center; gap: 8px; flex: 1 1 280px; min-width: 0; }
.yr input { flex: 1; min-width: 0; accent-color: var(--sel); }
.yr output { flex: none; min-width: 5.2em; font-weight: 700; }
.seg { display: flex; gap: 4px; }
.legend { display: flex; align-items: center; gap: 4px; font-size: .75rem; color: var(--ink2); margin: 0 0 4px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 12px; border-radius: 3px; vertical-align: -1px; }
.banner { font-size: .85rem; background: var(--paper2); border-left: 3px solid var(--gold); padding: 4px 10px; margin: 0 0 6px; max-width: 860px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
#map { display: block; width: 100%; height: auto; max-width: 860px; }
.tile { stroke: var(--paper); stroke-width: 1.5; stroke-linejoin: round; cursor: pointer; }
.tile.sel, .tile:focus-visible { stroke: var(--sel); stroke-width: 3; }
.tile:focus { outline: none; }
.lbl { font-size: var(--lf, 12px); fill: var(--ink); pointer-events: none; }
.lbl .n { font-weight: 700; }
.lbl .p { font-size: .82em; }
.lbl.on4 { fill: var(--on4); }
.panel { background: var(--paper2); border-radius: 10px; padding: 14px 16px; position: sticky; top: calc(var(--hh, 0px) + 12px); max-height: calc(100vh - var(--hh, 0px) - 24px); overflow-y: auto; }
.panel h3 { font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 22px; margin: 0; line-height: 1.4; }
.hint { color: var(--ink2); margin: 0; }
.row { padding: 7px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.bn { font-weight: 700; }
.br { font-size: .9rem; }
.star { color: var(--gold); font-weight: 700; }
.to { padding: 0; margin: 0; border: 0; background: none; cursor: pointer; text-align: left; font-weight: 700; text-decoration: underline; text-decoration-color: var(--ink2); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.sub { font-size: .8rem; color: var(--ink2); }
@media (max-width: 800px) {
  header { padding: 8px 12px; }
  main { padding: 10px 12px 28px; }
  .layout { grid-template-columns: 1fr; gap: 12px; }
  .panel { position: static; max-height: none; }
}

/* 年の並び（○☆） */
.strip { display: inline-flex; gap: 2px; vertical-align: middle; }
.strip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.strip .s0 { background: var(--line); transform: scale(.45); }
.strip .s1, .strip .s3 { border: 1.5px solid var(--award); }
.strip .s2 { background: var(--gold); }
.strip .gap { margin-left: 3px; }
.tl { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; margin: 8px 0 4px; max-width: 760px; }
.tl div { text-align: center; font-size: .72rem; color: var(--ink2); border-radius: 6px; padding: 3px 0 2px; background: var(--paper2); }
.tl b { display: block; font-size: 1.05rem; line-height: 1.3; }
.tl .s2 b { color: var(--gold); }
.tl .s1 b, .tl .s3 b { color: var(--award); }
.tl .s0 b { color: var(--line); }

/* 推移 */
.chart { display: block; width: 100%; height: auto; max-width: 760px; touch-action: pan-y; }
.chart text { font-size: var(--cf, 11px); fill: var(--ink2); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .cur { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.readout { font-size: .85rem; min-height: 1.7em; margin: 2px 0 0; max-width: 760px; }
.readout b { font-weight: 700; }
select { font: inherit; font-size: 16px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper2); color: var(--ink); }
.trend + .trend { margin-top: 22px; }

/* 蔵 */
.list { max-width: 760px; }
.rank { display: grid; grid-template-columns: 2.4em minmax(0, 1fr); gap: 0 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.rank .no { color: var(--ink2); font-size: .85rem; text-align: right; padding-top: 2px; }
.more { margin: 10px 0; font-size: .88rem; font-weight: 700; padding: 6px 16px; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; }
.back { font-size: .85rem; padding: 3px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; margin-bottom: 8px; }
.detail h3 { font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.35rem; margin: 0; line-height: 1.4; }
.yrow { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 0 8px; padding: 5px 0; border-top: 1px solid var(--line); font-size: .92rem; }
.yrow .y { color: var(--ink2); }
.count { font-size: .8rem; color: var(--ink2); margin: 0 0 4px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.empty { color: var(--ink2); text-align: center; padding: 32px 0; }
footer { font-size: .75rem; color: var(--ink2); padding: 0 16px 32px; }
footer p { margin: 4px 0; }
footer .pdfs a { margin-right: 6px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>全国新酒鑑評会 入賞酒の記録</h1>
    <div class="meta" id="meta"></div>
    <div class="ctrl">
      <input class="search" id="q" type="search" placeholder="蔵名・銘柄で探す" autocomplete="off">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-map" aria-selected="true">地図</button>
        <button class="tab" role="tab" id="tab-trend" aria-selected="false">推移</button>
        <button class="tab" role="tab" id="tab-brew" aria-selected="false">蔵</button>
      </div>
    </div>
  </div>
</header>
<main>
  <div class="wrap">
    <section id="v-map">
      <div class="mapctl">
        <div class="yr">
          <input type="range" id="yr" min="0" step="1" aria-label="酒造年度">
          <output id="yrout"></output>
          <button class="chip" id="cum" aria-pressed="false">累計</button>
        </div>
        <div class="seg">
          <button class="chip" data-m="gold" aria-pressed="true">金賞</button>
          <button class="chip" data-m="awards" aria-pressed="false">入賞</button>
        </div>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="legend" id="legend"></div>
      <div class="layout">
        <svg id="map" viewBox="42 6 804 623" role="group" aria-label="都道府県の地図"></svg>
        <aside class="panel" id="panel" aria-live="polite"></aside>
      </div>
    </section>
    <section id="v-trend" hidden>
      <div class="trend">
        <h2 class="sec">全国の点数</h2>
        <svg class="chart" id="c-all"></svg>
        <p class="readout" id="r-all"></p>
        <p class="note" id="n-all"></p>
      </div>
      <div class="trend">
        <h2 class="sec">県の点数 <select id="tp" aria-label="県"></select></h2>
        <svg class="chart" id="c-pref"></svg>
        <p class="readout" id="r-pref"></p>
        <p class="note">県ごとの出品点数は目録に載っていないため、入賞と金賞だけです。</p>
      </div>
    </section>
    <section id="v-brew" class="list" hidden></section>
    <section id="v-search" class="list" hidden></section>
  </div>
</main>
<footer><div class="wrap" id="notes"></div></footer>

const yshort = i => Y[i].year === "R01" ? "R元" : Y[i].year.replace(/^([HR])0?/, "$1");
const GOLDY = Y.map(y => y.has_gold_column);
const NGOLDY = GOLDY.filter(Boolean).length;
const NOGOLD = Y.map((y, i) => y.has_gold_column ? null : y.label).filter(Boolean);
// 金賞欄のない年度の説明は、その年度の結果ページの注記（原文）をそのまま引く
const gnote = i => Y[i].notes.find(n => n.includes("金賞"));
const noGoldText = i => gnote(i) ? `${esc(Y[i].label)}酒造年度の結果ページに「${esc(gnote(i))}」とあり、目録にも金賞欄がありません` : `${esc(Y[i].label)}酒造年度の目録には金賞欄がありません`;
const NOGOLD_TXT = Y.map((y, i) => y.has_gold_column ? null : noGoldText(i)).filter(Boolean).join("。") + (NOGOLD.length ? "。" : "");

// ---- 集計（すべて目録の行から数える）
const byYP = Y.map(() => P.map(() => ({ awards: 0, gold: 0 })));
const rowsOfBrew = DATA.brews.map(() => []);
DATA.rows.forEach((r, i) => {
  const [y, b, , , g] = r, p = DATA.brews[b][1];
  byYP[y][p].awards++;
  if (g === 1) byYP[y][p].gold++;
  rowsOfBrew[b].push(i);
});
const cumP = P.map((_, p) => ({ awards: byYP.reduce((s, a) => s + a[p].awards, 0), gold: byYP.reduce((s, a) => s + a[p].gold, 0) }));
// 製造場ごと：年の状態 0=なし 1=入賞 2=金賞 3=入賞（金賞欄のない年度）
const BS = DATA.brews.map((b, bi) => {
  const st = new Array(NY).fill(0);
  for (const i of rowsOfBrew[bi]) {
    const [y, , , , g] = DATA.rows[i];
    st[y] = Math.max(st[y], g === 1 ? 2 : g === -1 ? 3 : 1);
  }
  let best = 0, cur = 0;
  for (let y = 0; y < NY; y++) {
    if (!GOLDY[y]) continue; // 金賞欄のない年度は連続を切らず、数えもしない
    cur = st[y] === 2 ? cur + 1 : 0;
    best = Math.max(best, cur);
  }
  return { st, gy: st.filter(s => s === 2).length, ay: st.filter(s => s > 0).length, streak: best, now: cur };
});

function chart(el, out, series) {
  const W = 640, H = 250, L = 54, Rr = 52, T = 14, B = 30;
  const vals = series.flatMap(s => s.v.filter(v => v != null));
  const raw = Math.max(1, ...vals), step = raw > 500 ? 200 : raw > 200 ? 100 : raw > 50 ? 20 : raw > 20 ? 5 : raw > 8 ? 2 : 1;
  const max = Math.ceil(raw / step) * step;
  const x = i => L + (W - L - Rr) * i / (NY - 1), yv = v => T + (H - T - B) * (1 - v / max);
  let s = "";
  for (let v = 0; v <= max; v += step) s += `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${yv(v)}" y2="${yv(v)}"/><text x="${L - 6}" y="${yv(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  for (let i = 0; i < NY; i += 3) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(yshort(i))}</text>`;
  const ends = [];
  for (const se of series) {
    let d = "", pen = false;
    se.v.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + yv(v).toFixed(1); pen = true; });
    s += `<path class="ln" d="${d}" style="stroke:var(${se.c})"/>`;
    se.v.forEach((v, i) => { if (v != null && (i === 0 || se.v[i - 1] == null) && (i === NY - 1 || se.v[i + 1] == null)) s += `<circle cx="${x(i)}" cy="${yv(v)}" r="2.5" style="fill:var(${se.c})"/>`; });
    const li = se.v.length - 1;
    if (se.v[li] != null) ends.push({ y: yv(se.v[li]), t: se.n, c: se.c });
  }
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 13) ends[k].y = ends[k - 1].y + 13;
  for (const e of ends) s += `<text x="${W - Rr + 6}" y="${e.y + 4}" style="fill:var(${e.c});font-weight:700">${e.t}</text>`;
  s += `<line class="cur" id="${el.id}-cur" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><rect x="${L - 10}" y="0" width="${W - L - Rr + 20}" height="${H}" fill="transparent"/>`;
  el.setAttribute("viewBox", `0 0 ${W} ${H}`);
  el.innerHTML = s;
  const show = i => {
    const c = el.querySelector("line.cur");
    c.setAttribute("x1", x(i)); c.setAttribute("x2", x(i)); c.setAttribute("visibility", "visible");
    out.innerHTML = `<b>${esc(yname(i))}</b>　` + series.map(se => `<span style="color:var(${se.c})">${se.n} ${se.v[i] == null ? (se.na ? se.na(i) : "—") : fmt(se.v[i]) + "点"}</span>`).join("　");
  };
  const move = e => {
    const r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    show(Math.max(0, Math.min(NY - 1, Math.round((px - L) / (W - L - Rr) * (NY - 1)))));
  };
  el.onpointermove = move; el.onpointerdown = move;
  show(NY - 1);
}

  return [...set].join("\n");
});
const BRANDS = DATA.brews.map((_, bi) => [...new Set(rowsOfBrew[bi].map(i => DATA.rows[i][3]))]);
function hl(s, q) {

  if (i < 0 || nz(s) !== s.replace(/[\s　]/g, "")) return t.includes(esc(q)) ? t.split(esc(q)).join(`<mark>${esc(q)}</mark>`) : t;
  return t.split(esc(q)).join(`<mark>${esc(q)}</mark>`);
}
